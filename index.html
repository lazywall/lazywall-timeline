<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lazywall Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0d0c; --panel:#181513; --panel2:#201c19; --line:#342f2a;
  --ink:#f4ede3; --mute:#a79d90; --acc:#ffd21f; --acc2:#fff2a6;
  --c-gig:#ffd21f; --c-rec:#ff8a3d; --c-rel:#7fd6c2; --c-press:#c79bff; --c-tour:#ff5c8a; --c-photo:#8fb4ff; --c-band:#e8e2d8;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --body:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);color-scheme:dark}
body{padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:20px 28px}
button{font:inherit;color:inherit;cursor:pointer}
.lw{max-width:1180px;margin:0 auto}
.lw-top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px;margin-bottom:18px}
.lw-kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--acc);font-weight:600}
.lw-h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,6vw,64px);line-height:.95;margin:6px 0 0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.lw-h1 span{color:var(--acc)}
.lw-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lw-chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--mute);display:inline-flex;gap:7px;align-items:center;transition:.15s}
.lw-chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--mute));display:inline-block}
.lw-chip:hover{color:var(--ink);border-color:var(--mute)}
.lw-chip[aria-pressed=true]{background:var(--ink);color:#15110e;border-color:var(--ink)}
.lw-play{background:var(--acc);border-color:var(--acc);color:#1a1400;font-weight:600}
.lw-play:hover{color:#1a1400;filter:brightness(1.08)}

/* eras */
.lw-eras{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.lw-era{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;transition:.15s}
.lw-era strong{font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.04em;color:var(--mute)}
.lw-era:hover:not(:disabled){border-color:var(--mute)}.lw-era:hover:not(:disabled) strong{color:var(--ink)}
.lw-era[aria-current=true]{background:var(--acc);border-color:var(--acc)}.lw-era[aria-current=true] strong{color:#1a1400}
.lw-era:disabled{opacity:.3;cursor:default}
/* rail */
.lw-rail{position:relative;border:1px solid var(--line);background:var(--panel);border-radius:16px;margin-bottom:16px}
.lw-scroll{overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent;padding:30px 28px 26px;scroll-behavior:smooth}
.lw-track{position:relative;display:flex;align-items:center;height:30px;min-width:max-content}
.lw-track::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--line);transform:translateY(-50%)}
.lw-tick{position:relative;flex:none;width:30px;height:30px;background:none;border:0;padding:0;display:grid;place-items:center}
.lw-tick b{display:block;width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--panel);transition:.18s}
.lw-tick:hover b{transform:scale(1.5)}
.lw-tick[aria-current=true] b{width:18px;height:18px;box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--c),0 0 18px var(--c)}
.lw-tick.is-range b{width:22px;height:8px;border-radius:5px}
.lw-tick.is-range[aria-current=true] b{height:14px;width:28px}
.lw-yr{position:absolute;top:-22px;left:50%;transform:translateX(-4px);font-family:var(--display);font-size:15px;color:var(--mute);letter-spacing:.03em;pointer-events:none;white-space:nowrap}
.lw-yr::before{content:"";position:absolute;left:4px;top:22px;height:18px;width:1px;background:var(--line)}
.lw-yr.lo{top:auto;bottom:-23px}.lw-yr.lo::before{top:-14px;height:10px}
.lw-fade{position:absolute;top:0;bottom:0;width:28px;pointer-events:none;z-index:2}
.lw-fade.l{left:1px;background:linear-gradient(90deg,var(--panel),transparent);border-radius:16px 0 0 16px}
.lw-fade.r{right:1px;background:linear-gradient(270deg,var(--panel),transparent);border-radius:0 16px 16px 0}

/* stage */
.lw-stage{position:relative;display:grid;grid-template-columns:clamp(52px,6vw,84px) minmax(0,5fr) minmax(0,6fr) clamp(52px,6vw,84px);gap:0;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--panel);min-height:480px}
.lw-info{padding:clamp(20px,3vw,36px);display:flex;flex-direction:column;gap:14px;min-width:0}
.lw-meta{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.lw-badge{display:inline-flex;align-items:center;gap:7px;color:var(--c);font-weight:600}
.lw-badge i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.lw-date{font-family:var(--display);font-size:clamp(40px,6.4vw,76px);line-height:.92;color:var(--acc);text-transform:uppercase;margin:0;letter-spacing:.01em}
.lw-date small{display:block;font-size:.44em;color:var(--ink);letter-spacing:.08em;margin-top:6px}
.lw-title{font-size:clamp(20px,2.4vw,27px);line-height:1.2;font-weight:600;margin:0;text-wrap:balance}
.lw-text{font-size:16px;line-height:1.65;color:#d9d0c3;margin:0;max-width:62ch;overflow-wrap:anywhere}
.lw-text.is-short{color:var(--mute)}
.lw-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.lw-link{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--ink);text-decoration:none;background:var(--panel2)}
.lw-link:hover{border-color:var(--acc);color:var(--acc)}
.lw-side{background:var(--panel2);border:0;color:var(--ink);display:grid;place-items:center;transition:.15s;padding:0;align-self:stretch}
.lw-side.l{border-right:1px solid var(--line)}.lw-side.r{border-left:1px solid var(--line)}
.lw-side svg{width:clamp(30px,3.4vw,46px);height:clamp(30px,3.4vw,46px)}
.lw-side:hover:not(:disabled){background:var(--acc);color:#1a1400}
.lw-side:disabled{opacity:.25;cursor:default}
.lw-nav{margin-top:auto;display:flex;align-items:center;gap:10px;padding-top:10px}
.lw-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;transition:.15s}
.lw-btn:hover:not(:disabled){background:var(--acc);border-color:var(--acc);color:#1a1400}
.lw-btn:disabled{opacity:.3;cursor:default}
.lw-count{font-size:13px;color:var(--mute);margin-left:6px;font-variant-numeric:tabular-nums}
.lw-count b{color:var(--ink);font-weight:600}
.lw-hint{margin-left:auto;font-size:12px;color:var(--mute)}
.lw-bar{position:absolute;left:0;bottom:0;height:3px;background:var(--acc);width:0}

/* media */
.lw-media{position:relative;background:#0a0908;display:flex;flex-direction:column;min-width:0;border-left:1px solid var(--line)}
.lw-view{position:relative;flex:1;min-height:300px;display:grid;place-items:center;overflow:hidden}
.lw-view>*{max-width:100%}
.lw-img{width:100%;height:100%;object-fit:contain;display:block;cursor:zoom-in;max-height:560px}
.lw-view .lw-blur{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(28px) brightness(.45);transform:scale(1.1)}
.lw-view img.lw-img{position:relative}
.lw-yt{position:relative;width:100%;aspect-ratio:16/9;background:#000 center/cover no-repeat;border:0;padding:0;display:grid;place-items:center}
.lw-yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.lw-yt .lw-playicon{width:76px;height:54px;border-radius:14px;background:rgba(255,210,31,.95);color:#1a1400;display:grid;place-items:center;box-shadow:0 8px 30px rgba(0,0,0,.5);transition:.15s}
.lw-yt:hover .lw-playicon{transform:scale(1.08)}
.lw-sc{width:100%;padding:24px;display:grid;gap:14px;justify-items:center;text-align:center}
.lw-sc iframe{width:100%;height:166px;border:0;border-radius:10px}
.lw-empty{display:grid;place-items:center;gap:14px;text-align:center;color:var(--mute);padding:30px;font-size:14px;background:repeating-linear-gradient(135deg,#120f0d 0 14px,#16120f 14px 28px);width:100%;height:100%;min-height:300px}
.lw-empty svg{opacity:.5}
.lw-empty .lw-wm{font-family:var(--display);font-size:clamp(40px,7vw,80px);line-height:1;color:#241f1b;letter-spacing:.04em;text-transform:uppercase}
.lw-thumbs{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--panel);overflow-x:auto}
.lw-thumb{flex:none;width:74px;height:52px;border-radius:8px;border:2px solid transparent;background:#0a0908 center/cover no-repeat;display:grid;place-items:center;color:var(--mute);font-size:11px;padding:0;overflow:hidden}
.lw-thumb[aria-current=true]{border-color:var(--acc)}
.lw-cap{position:absolute;left:12px;bottom:12px;font-size:12px;background:rgba(0,0,0,.6);border-radius:6px;padding:4px 8px;color:#ddd}
.lw-in{animation:lwIn .35s ease both}
@keyframes lwIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* lightbox */
.lw-lb{position:fixed;inset:0;background:rgba(5,4,3,.94);display:none;place-items:center;z-index:50;padding:20px}
.lw-lb.on{display:grid}
.lw-lb img{max-width:100%;max-height:92vh;object-fit:contain;border-radius:8px}
.lw-lb button{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:14px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel2)}

/* list */
.lw-listwrap{margin-top:16px}
.lw-listbtn{width:100%;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px 18px;font-weight:600}
.lw-list{display:none;margin-top:8px;border:1px solid var(--line);border-radius:14px;background:var(--panel);max-height:420px;overflow:auto}
.lw-list.on{display:block}
.lw-row{display:grid;grid-template-columns:96px 14px minmax(0,1fr);gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 16px}
.lw-row:last-child{border-bottom:0}
.lw-eh{position:sticky;top:0;z-index:1;background:var(--bg);padding:9px 16px;font-family:var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--acc);font-size:15px;border-bottom:1px solid var(--line)}
.lw-row:hover,.lw-row[aria-current=true]{background:var(--panel2)}
.lw-row time{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.lw-row i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.lw-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lw-foot{margin-top:18px;font-size:12px;color:var(--mute);text-align:center}

button:focus-visible,a:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}

@media (max-width:820px){
  .lw-eras{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lw-stage{grid-template-columns:48px minmax(0,1fr) 48px}
  .lw-side.l{grid-column:1;grid-row:1/3}.lw-side.r{grid-column:3;grid-row:1/3}
  .lw-media{grid-column:2;grid-row:1;border-left:0;border-bottom:1px solid var(--line)}
  .lw-info{grid-column:2;grid-row:2}
  .lw-view{min-height:240px}
  .lw-hint{display:none}
  .lw-row{grid-template-columns:78px 12px minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){.lw-in{animation:none}.lw-scroll{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="lw" id="lw" aria-label="Lazywall timeline">
  <header class="lw-top">
    <div>
      <div class="lw-kicker" id="kick">Lazywall · The story so far</div>
      <h1 class="lw-h1">The Lazywall <span>Timeline</span></h1>
    </div>
    <div class="lw-tools" id="tools"></div>
  </header>
  <nav class="lw-eras" id="eras" aria-label="Years"></nav>
  <div class="lw-rail">
    <div class="lw-fade l"></div><div class="lw-fade r"></div>
    <div class="lw-scroll" id="scroll"><div class="lw-track" id="track" role="tablist" aria-label="Events"></div></div>
  </div>
  <section class="lw-stage" aria-live="polite">
    <button class="lw-side l" id="prev" aria-label="Previous event"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l-8 8 8 8"/></svg></button>
    <div class="lw-info">
      <div class="lw-meta"><span class="lw-badge" id="badge"></span></div>
      <h2 class="lw-date" id="date"></h2>
      <h3 class="lw-title" id="title"></h3>
      <p class="lw-text" id="text"></p>
      <div class="lw-links" id="links"></div>
      <div class="lw-nav">
        <span class="lw-count" id="count"></span>
        <span class="lw-hint">← → keys · swipe</span>
      </div>
    </div>
    <div class="lw-media">
      <div class="lw-view" id="view"></div>
      <div class="lw-thumbs" id="thumbs" hidden></div>
    </div>
    <button class="lw-side r" id="next" aria-label="Next event"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4l8 8-8 8"/></svg></button>
    <div class="lw-bar" id="bar"></div>
  </section>
  <div class="lw-listwrap">
    <button class="lw-listbtn" id="listbtn" aria-expanded="false"><span>All events</span><span id="listn"></span></button>
    <div class="lw-list" id="list"></div>
  </div>
  <p class="lw-foot">lazywall.com</p>
</div>
<div class="lw-lb" id="lb" role="dialog" aria-label="Image"><button aria-label="Close">✕</button><img alt=""></div>

<script>
(function(){
"use strict";
/* ============ DATA (edit freely: d = start date, e = end date, t = title, x = text, m = media links) ============ */
var ERAS = [{"k":"all","n":"The Lazywall Timeline","ev":[{"d":"2003-03-01","e":null,"t":"Lazywall is born in Reading, UK","x":"Monz put an advert at a Reading music show where John Lanigan was working at. Nao & Monz will play 2 songs acoustic at the 3Bs a few days after & rehearsals with John will start in may at Impact Studios","m":["images/vimeo-badge.jpg"]},{"d":"2003-05-01","e":"2003-09-01","t":"Rehearsals @ Impact Studios","x":"Thanks to Andy, Chris, Ben & Ben, and all impact crew for the tea & the \"free\" hours! Many songs were written during these sessions","m":["images/rehearsal-nao-mondz.jpg"]},{"d":"2003-09-19","e":null,"t":"1st photos session","x":"With James H Quinton, Woking UK. I remember we had a terrible image at that time. We didnt really know what we wanted","m":["images/lazywall-jq001.jpg"]},{"d":"2003-09-23","e":null,"t":"1st Gig","x":"Sweats, tears & blood @ Purple Turle, Reading UK ... We met Laz early september, he came down to our rehearsal room to offer us a gig & said to John \"I didnt know you play shit like this!\". Thanks Laz & RRR for your amazing help. Setlist: Tramps/State Of Mind/My Personality/I Raise My Hand/Calling You Home/Brother/Not Innocent/Out Of Tears/Wasting My Time/The World In My Hand","m":["images/23-09-2003-poster-gig.jpg","http://soundcloud.com/lazywall/tramps-live"]},{"d":"2003-10-17","e":null,"t":"King's Tavern","x":"2nd show","m":["images/pict0002.jpg"]},{"d":"2003-10-19","e":null,"t":"1st Recording Session","x":"Demos of I Raise My Hand (original), Out Of Tears (original), My Personality, State Of Mind, recorded at Bandbits Studios, Reading UK. The producer & Engineer had a cold!! So he told us his ears were stuck & couldnt hear the mix very well. That demo tape never made it out but helped get us a few gigs & a radio interview at the local college","m":["images/pict0001.jpg"]},{"d":"2003-11-01","e":null,"t":"1st Radio Interview","x":"Radio Blast with Tim Wolfe at the Reading College. We played a few acoustic songs","m":["images/pict0042.jpg"]},{"d":"2003-11-13","e":null,"t":"Bar Oz","x":"1st Live DVD recorded with 3 cameras at the Bar Oz, Reading. Setlist: Revolution/State Of Mind/Reality/In The Shade/I Raise My Hand/My Personality/Executed","m":["images/pict0020.jpg","https://youtu.be/PFSkaTv_ALk","https://youtu.be/nFfUzlkKDaE"]},{"d":"2003-11-16","e":null,"t":"Pals, Croydon","x":"First road trip to London with Ryan, singer of Exit 10 and his Van","m":["images/pict0043.jpg"]},{"d":"2003-11-22","e":null,"t":"Rising Sun Arts Center","x":"Reading","m":["images/pict0010.jpg"]},{"d":"2003-11-22","e":null,"t":"Lazywall & Gary Field","x":"Gary will become the band's manager & one of the most influencial person on the band for the next years. Gary wanted to buy an amp & a guitar from John's shop so John made him come to our show at the Rising Sun Arts Center. He loved the gig but said our demo sucked! so he offered to help us record a decent one at Leicester's Rainstudios","m":["images/cnv00032.jpg"]},{"d":"2003-12-20","e":null,"t":"3B's","x":"We played with Ben Marwood's band, and the drummer at the end of their set kicked Monz bassdrum to the floor. Ben punched him in the face.","m":["images/pict0036.jpg"]},{"d":"2004-01-20","e":null,"t":"Brixton Telegraph","x":"Red Gecko / Lazywall / No Direxion / Wasteland","m":["images/pict0022.jpg"]},{"d":"2004-01-31","e":null,"t":"Northcroft Center","x":"Newbury","m":["images/img-0008.jpg"]},{"d":"2004-07-12","e":null,"t":"Barcode Disclosure Recordings","x":"\"Blame me\", \"Reality\", \"Executed\" @ Rainstudios, Leicester UK. 2 days recordings weekend. Gary sent the tapes to some A&Rs in the US to get some feedback. We finally decided we had to re-do the recordings with a producer","m":["images/2004-barcode-disclosure.jpg","https://youtu.be/vtKizDBEw74"]},{"d":"2004-07-17","e":null,"t":"Henley Festival 2004","x":"Acoustic show at Henley-on-thames, UK. we heard that Jimmy Page lived nearby & used to come to the festival, but he never showed up. Setlist: Blame Me/Above Me/Reality/My Friends (RHCP cover)","m":[]},{"d":"2004-08-31","e":null,"t":"\"Reality\" Video","x":"Directed by Ben Adler. We shot at Leicester Rainstudios, where previous demos were made. Gary had the idea for Nao's hat a few weeks before. He also thought about John's glasses but that didnt last long. Monz had to remove the bassdrum pedal to be able to hear the playback","m":["http://www.youtube.com/watch?v=SI1UE1Fl4zo"]},{"d":"2004-09-26","e":null,"t":"ZeeFest","x":"Chichester university","m":["images/chichester.jpg"]},{"d":"2004-11-05","e":null,"t":"Chichester University","x":"Chichester","m":["images/dsc00962.jpg"]},{"d":"2004-12-01","e":null,"t":"Barcode Disclosure take #2","x":"We did all over again but this time we worked with Ainsley Lester as producer who prefered to go eat the pizzas than assist to the vocals sessions.","m":["images/dsc01771.jpg"]},{"d":"2004-12-08","e":null,"t":"Purple Turtle","x":"Reading","m":["images/nao-01.jpg"]},{"d":"2004-12-19","e":null,"t":"\"Superficial\"","x":"Recording at Outhouse Studios, produced by John Mitchell (ex-Arena, producer of A, Funeral For A Friend, ...), Reading UK. We also remixed Reality & Blame Me. Superficial became part of the VisitBritain compilation CD","m":[]},{"d":"2005-01-08","e":null,"t":"21 South Street","x":"Gig at 21 South street with an interview with a local newspaper","m":["images/lazywall.jpg"]},{"d":"2005-02-01","e":null,"t":"Barcode Disclosure Release","x":"Recorded in Leicester, UK. Reality / Executed / Blame Me","m":["images/bumpstudios-front-insert-copy.jpg","images/barcodedisclosure.jpg"]},{"d":"2005-02-25","e":null,"t":"Birmingham US Label Showcase","x":"Gig @ Hard Rock Cafe in Birmingham, part of the XMG U.S Major Record Label Showcase. Atlantic A&R seemed very interested & said we had the full package.","m":[]},{"d":"2005-03-19","e":null,"t":"Photo Session","x":"by Maria Monfort, we shot the pictures at the Reading College. One of the picture was used later on the inside package of Primal Tapes EP","m":["images/dsc-0073.jpg"]},{"d":"2005-04-07","e":null,"t":"\"Dead & Unknown\"","x":"Recording at Outhouse Studios, produced by John Mitchell, feat. Laz Pallagi from Obiat","m":[]},{"d":"2005-04-09","e":null,"t":"The Boxing Club","x":"Reading","m":["images/lazywall-boxing1-300x220.jpg"]},{"d":"2005-07-13","e":null,"t":"Chichester University","x":"Chichester","m":["images/pict0040.jpg"]},{"d":"2005-07-30","e":null,"t":"Impact Studios","x":"Reading","m":["https://youtu.be/id9tpOkQaKc"]},{"d":"2005-08-18","e":null,"t":"Purple Turtle","x":"With The Bonfire Episode","m":["images/lazywall-10.jpg"]},{"d":"2005-09-03","e":null,"t":"Alfest 2005","x":"We played just after they opened the food restaurants. playing with the smell of falafel","m":["images/cnv00009.jpg"]},{"d":"2005-09-16","e":null,"t":"Agincourt","x":"Camberley","m":["images/cnv00035.jpg"]},{"d":"2005-10-02","e":null,"t":"Manchester In The City","x":"Industry showcase for british bands in front of a panel of A&Rs & Labels. the only problem is that no A&Rs showed up. they were drinking down at the pub on the cost of the labels as usual. We learned to Never trust this kind of bullshit","m":[]},{"d":"2005-11-11","e":null,"t":"Demo Release","x":"Produced by John Mitchell, Reading, UK . Superficial / Dead And Unknown / Reality","m":["images/2005-demo.jpg"]},{"d":"2005-11-19","e":null,"t":"Impact Studios","x":"Reading","m":["images/impact-051.jpg"]},{"d":"2005-11-26","e":null,"t":"Rivermead","x":"Reading","m":["images/rivermead-007.jpg"]},{"d":"2006-01-27","e":null,"t":"Agincourt","x":"Camberley","m":["https://youtu.be/CsGSXC7OXoE"]},{"d":"2006-03-04","e":"2006-03-12","t":"Chicago Recordings","x":"Primal Tapes EP, at Electrical Audio studios with Steve Albini. I remember we decided a few months ago to work with producer Ron Saint-Germain, but he had quite a busy year, so Gary managed to convince Steve to work with us for our new EP. Amazing producer, amazing person too. watching him work on analog desk just like he was playing in instrument. Genius!","m":["images/pict0017.jpg"]},{"d":"2006-03-22","e":null,"t":"Abbey Roads Studios","x":"Mastering of \"Primal Tapes\" by Sean Mcgee. Was quite funny to know our EP was being mastered on the same desk they used on The Dark Side Of The Moon","m":["images/picture086.jpg"]},{"d":"2006-04-20","e":null,"t":"First appearance on Moroccan newspaper","x":"article on Maroc Soir / eMarrakech written by freelancer Iman Chair","m":["images/marocsoir.jpg"]},{"d":"2006-04-27","e":null,"t":"Photo Session","x":"Juan Lu Vela @ Reading","m":["images/jlv-0076-green.jpg"]},{"d":"2006-06-03","e":null,"t":"L'Boulevard 2006","x":"First gig in Morocco at Le Boulevard des jeunes musiciens, In Casablanca, playing with Moonspell & Syncop. First time we play in front of so many people, 20000 fans shouting \"lazywall\" when they realized we were moroccan. We will never forget this moment. We knew it was time to come back home","m":["images/p1010111.jpg"]},{"d":"2006-06-07","e":null,"t":"Sala Caracol","x":"Madrid, first gig in Spain as Lazywall","m":[]},{"d":"2006-06-09","e":null,"t":"Plug'n'play","x":"Reading","m":["images/lw8-sharp-2.jpg"]},{"d":"2006-06-29","e":null,"t":"Recordings at No Connection Studios","x":"Thanks to Graham Young, we recorded 2 songs live in his band's studios. \"Let Me See Your Faces\" & \"Out Of My Head\". We never released them though","m":["http://soundcloud.com/lazywall/lazywall-out-of-my-head"]},{"d":"2006-08-29","e":null,"t":"The Cartoon","x":"London","m":["images/dscf0488.jpg"]},{"d":"2006-09-03","e":null,"t":"Purple Turtle","x":"Reading","m":["images/lazywall.jpg"]},{"d":"2006-09-26","e":null,"t":"Supporting Breed 77","x":"At the Fez Club, Reading UK. we had real fun with the Breed 77 guys specially when we told them we were neighbours, Gibraltar is just around the corner from Tangier. Spent the whole night playing table football, speaking spanish & listening to Camaron on their tour bus","m":["images/breed-77-lazywall-live-014.jpg"]},{"d":"2006-10-01","e":null,"t":"Kip'Fest","x":"Tribute gig to Kip (R.I.P) with Obiat, Mudgun, Static Rain,... He was a big fan of Lazywall, used to come to all our gigs. We miss you Kip","m":["http://www.youtube.com/watch?v=QA8JN9wZ-5s"]},{"d":"2006-11-01","e":null,"t":"The Croft","x":"with Merrick (UK) & Father (Croacia) @ Bristol","m":["https://youtu.be/9_wp-Jg8_nQ"]},{"d":"2006-11-03","e":null,"t":"Primal Tapes Release","x":"Ad appear on Kerrang Magazine. Produced by Steve Albini, Chicago\nMastered at Abbey Road, London. Back To The Cradle/Come Undone/I Erase You","m":["images/release.jpg"]},{"d":"2007-01-30","e":"2007-02-04","t":"Czech Republic Tour","x":"Touring with czech band Flood @ Praha, Jihlava, Pardubice, Havlickuv Brod. Nao had 39° flu for the tour, the czech driver gave him some sea water treatment! John spent the whole tour on the phone, he wasnt really enjoying it, we knew something was going on. The day we came back to England, he said he was leaving the band","m":["http://www.youtube.com/watch?v=nms6HalRSZ4"]},{"d":"2007-02-18","e":null,"t":"John Lanigan leaves the band","x":"Last gig with John at PlugNPlay, Reading. The set started with the recently written \"C.L.A.B.\" on drums & bass only to show our fans that the show must go on","m":[]},{"d":"2007-04-28","e":null,"t":"Tattoo Art Fest","x":"First show in France - Paris, with guitarist Graham Young & Laz from Obiat. Graham got the whole set ready in 6 days, Thanks Zarand for the great road trip. We shared the stage with french stoners RBO","m":["images/image-16.jpg"]},{"d":"2007-07-01","e":null,"t":"Festival Les Nuits De La Méditerranée 2007","x":"with guitarist Graeme Baldwin from Daddy's Little Secrets who had a terrible experience passing out 5min before going on stage, he was taken to hospital. The rest of the band played the first Rock gig ever with no guitarist! 2 days later, Gary, Graeme, Laz & Hamed Nik took the flight back to the UK, Nao & Monz decided to \"miss\" the plane & stay home for good","m":[]},{"d":"2007-10-01","e":null,"t":"Hard Rock Magazine France","x":"\"Back To The Cradle\" on sample CD & an interview","m":["images/press-reviews.jpg"]},{"d":"2007-10-30","e":null,"t":"Lee Blackmore joins the band","x":"We played our first show with Lee the day before starting the France tour, at the purple turtle in Reading","m":["images/abderrahmane-marzoug.jpg"]},{"d":"2007-11-03","e":null,"t":"Festival Passer nous voir","x":"First show of the french tour at Glageon, north of France. Our false promoter didnt book any place to stay after the show so the festival organizers invited us to sleep at their place. Best people!","m":["images/img-3890.jpg"]},{"d":"2007-11-07","e":null,"t":"France Tour 2007","x":"Laz joined us in Paris, Zarand started the shows with his hurdy gurdy. We had to cancel the tour mid way into it when we realized our french tour promoter was keeping all the money. Fantastic gig at Hard Rock Café Paris","m":["images/capture-plein-ecran-20102012-105020-bmp.jpg"]},{"d":"2008-02-01","e":null,"t":"Apoptosia recordings starts","x":"started in february & lasted 7 months until we decided to finish the album with Anton Pukshansky in L.A. First collaboration with oud player Younes Fakhar who will later become a permanent member of the band. Blackmore & Laz will fly from the UK to Tangier for the recordings, Adnane & Hamza from Casablanca","m":["images/dscn1774.jpg"]},{"d":"2008-03-22","e":null,"t":"Festival International Des Nomades","x":"M'hamid El Ghizlane, Sahara, Morocco, with Laz Pallagi","m":["images/dscn1840.jpg"]},{"d":"2008-05-10","e":null,"t":"Mghrib Music Awards 2008","x":"20min Show & introducing the award for best metal album of the year","m":["images/img-4663.jpg"]},{"d":"2008-06-19","e":null,"t":"Photo Session","x":"photos by Iman Chair @ Hafa Café, with Hamed Nik & Lee Blackmore","m":["images/lazywall-par-iman-chair-haidar.jpg"]},{"d":"2008-06-21","e":null,"t":"L'Boulevard 2008"," oulevard Tour","x":"With Easymaze & Muslim","m":["images/lboulevardtour2010-tanger.jpg","https://youtu.be/DNkPiiDaX_Y"]},{"d":"2010-11-23","e":null,"t":"\"Superficial\" Rehearsal video","x":"Filmed by Karim Boubker & Aida Azlin","m":["https://youtu.be/cq2NH6V3BH0"]},{"d":"2011-01-05","e":null,"t":"\"Out Of Tears\" Video release","x":"with Karim Boubker & Aida Azlin","m":[]},{"d":"2011-04-08","e":null,"t":"Garorock 2011","x":"Marmande, France avec Apocalyptica, Morcheeba...","m":["images/lazywall-marmande-08042011-01.jpg"]},{"d":"2011-04-18","e":null,"t":"Lazy Van","x":"The band goes south to the desert to test the new van & the inspiration! We worked on the final version of Blind with producer & guitarist Hicham Mzouak","m":["images/img-20110420-162022.jpg"]},{"d":"2011-05-14","e":null,"t":"Nao on Ajial 2MTV","x":"Interview during Tremplin 2011, Lazywall becomes \"Les Hiouals\"","m":["images/nao.jpg"]},{"d":"2011-06-12","e":null,"t":"Gig @ Glaz'art","x":"Furia festival got cancelled a week before so Pierre our manager got us a last minute gig in Paris. We finally got to meet in person all our BTN fans","m":["http://www.youtube.com/watch?v=dX-tjN2Rtv8"]},{"d":"2011-06-13","e":null,"t":"Acoustic Radio Show @ BTN - OUI FM","x":"at the radio studios in Paris, thanks Pierre & Ben, we played \"I Raise My Hand\", \"Cold Enemy\" & a premiere of \"Divide & Conquer\" from the new album","m":["images/ouifm.jpg","http://www.youtube.com/watch?v=0LL7FbgcFb8"]},{"d":"2011-10-01","e":null,"t":"Moonfest Festival","x":"Lalla Takerkoust with Hoba Hoba Spirit, Justin Adams, Rouicha (R.I.P), Barry, Loonope","m":["images/lazywall-moonfest.jpg"]},{"d":"2011-11-29","e":null,"t":"BTN Festival","x":"festival organized by Bring The Noise & OUI FM, in Paris with Anathema & Kids In Glass Houses at Le Petit Bain, a boat on La Seine","m":["images/ouifm-festival.jpg"]},{"d":"2011-12-18","e":null,"t":"Acoustic videos of \"Blind\" & \"I Sold My Soul\"","x":"Recorded by Karim Boubker","m":["http://ww nds that raised us. Bands we grew up screaming along to.\nThis is how it happened. Nao & Monz flew from Tangier, Morocco. Met up with Youssef in Europe. And the three of us jumped on a night train to Prague.\nNo tour bus. No entourage. Just three brothers and a one-way ticket to the stage.\"","m":["https://www.youtube.com/watch?v=O1f5nn4Nn3c"]},{"d":"2026-11-10","e":null,"t":"Alex Henry Foster Tour - Day 1 Rabat","x":"At Sotto Sopra, acoustic show","m":[]},{"d":"2026-11-11","e":null,"t":"Alex Henry Foster Tour - Day 2 Casablanca","x":"At Backstage, cancelled due to power cut in the whole city of Casablanca due to bad weather","m":[]},{"d":"2026-11-13","e":null,"t":"Alex Henry Foster Tour - Day 3 Tangier","x":"At Dabatek, Tangier, acoustic show","m":[]},{"d":"2026-11-14","e":null,"t":"Alex Henry Foster Tour - Day 4 Tangier","x":"At Hotel Minzah, Tangier, acoustic show","m":[]}]}];
/* ================================================================================================================ */
var DATA=[];ERAS.forEach(function(e,ei){e.ev.forEach(function(o){o.era=ei;o.i=DATA.length;DATA.push(o)})});
var CATS={gig:["Gig / Show","--c-gig"],rec:["Studio","--c-rec"],rel:["Release","--c-rel"],press:["Press / Radio","--c-press"],tour:["Tour","--c-tour"],photo:["Photos","--c-photo"],band:["Band life","--c-band"]};
function cat(o){var t=o.t.toLowerCase(),x=o.x.toLowerCase();
  if(/tour/.test(t)||/road trip/.test(t))return"tour";
  if(/photo/.test(t))return"photo";
  if(/leaves|joins|new member|rehears|born|agency|animal farm|opens their own|re-joins/.test(t))return"band";
  if(/lyrics video|acoustic video|unplugged video|live video|rehearsal video|session|record|studio|\bmix/.test(t)||/^barcode|"superficial"|dead & unknown/.test(t))return"rec";
  if(/release|premiere|song out|new video|music video|\bvideo\b/.test(t)||/^new (song|release|video)|official release|first release|new song out|music video|release a song/.test(x))return"rel";
  if(/interview|radio|magazine|newspaper|podcast|\btv\b|tv5|medi1|netflix|msnbc|documentary|soundtrack|compilation|appearance on|korsa|cover of|article|diaspo/.test(t)||/interview|tv show/.test(x))return"press";
  return"gig";}
var MONTHS=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
DATA.forEach(function(o,i){o.i=i;o.k=cat(o);var p=o.d.split("-");o.y=+p[0];o.mo=+p[1]-1;o.dd=+p[2];
  if(o.e){var q=o.e.split("-");o.ey=+q[0];o.emo=+q[1]-1;o.edd=+q[2]}});
var $=function(id){return document.getElementById(id)};
var el=function(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
var cur=0,curEra=0,filter=null,vis=DATA.slice(),playing=false,timer=null,mIdx=0,PLAY_MS=7000,railEra=-1;

function fmtDate(o){
  var main,sub;
  if(o.e){ if(o.ey===o.y&&o.emo===o.mo){main=o.dd+"—"+o.edd+" "+MONTHS[o.mo];}
           else{main=MONTHS[o.mo]+" "+o.y;sub="→ "+MONTHS[o.emo]+" "+o.ey;return{main:main,sub:sub};} }
  else main=o.dd+" "+MONTHS[o.mo];
  return{main:main,sub:String(o.y)};
}
function ytId(u){var m=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:null}
function mType(u){if(ytId(u))return"yt";if(/soundcloud\.com/.test(u))return"sc";if(/vimeo\.com/.test(u)&&!/badge/.test(u))return"link";if(/\.(jpe?g|png|gif|webp)(\?|$)/i.test(u)||/googleusercontent|lazywall\.com\/files/.test(u))return"img";return"link"}
function host(u){try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return u}}
function svg(p,w){return '<svg width="'+(w||24)+'" height="'+(w||24)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>'}
var IC={img:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/>',ext:'<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/>',note:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',play:'<path d="M7 4l13 8-13 8z" fill="currentColor"/>'};

/* ---------- tools (filters + play) ---------- */
var tools=$("tools");
var pb=el("button","lw-chip lw-play");pb.innerHTML=svg(IC.play,14)+"<span>Play the story</span>";tools.appendChild(pb);
Object.keys(CATS).forEach(function(k){
  if(!DATA.some(function(o){return o.k===k}))return;
  var b=el("button","lw-chip");b.setAttribute("aria-pressed","false");b.style.setProperty("--c","var("+CATS[k][1]+")");
  b.innerHTML="<i></i><span>"+CATS[k][0]+"</span>";
  b.onclick=function(){filter=filter===k?null:k;Array.prototype.forEach.call(tools.querySelectorAll("[data-k]"),function(x){x.setAttribute("aria-pressed",x.dataset.k===filter)});applyFilter()};
  b.dataset.k=k;tools.appendChild(b)});

/* ---------- rail ---------- */
var track=$("track"),scroller=$("scroll");
function buildRail(){
  track.innerHTML="";var lastY=null,lastN=-9;railEra=curEra;
  vis.filter(function(o){return o.era===curEra}).forEach(function(o,n){
    var b=el("button","lw-tick"+(o.e?" is-range":""));b.setAttribute("role","tab");b.style.setProperty("--c","var("+CATS[o.k][1]+")");
    b.title=o.t+" — "+o.dd+" "+MONTHS[o.mo]+" "+o.y;b.setAttribute("aria-label",b.title);b.innerHTML="<b></b>";
    if(o.y!==lastY){var y=el("span","lw-yr"+(n-lastN<2?" lo":""),o.y);b.appendChild(y);lastY=o.y;lastN=n}
    b.onclick=function(){stop();go(o.i)};b.dataset.i=o.i;track.appendChild(b)});
}
function markRail(){
  Array.prototype.forEach.call($("eras").children,function(c){if(c.textContent==String(DATA[cur].y))c.setAttribute("aria-current","true");else c.removeAttribute("aria-current")});
  Array.prototype.forEach.call(track.children,function(t){var on=+t.dataset.i===cur;if(on)t.setAttribute("aria-current","true");else t.removeAttribute("aria-current");t.setAttribute("aria-selected",on)});
  var a=track.querySelector('[aria-current="true"]');
  if(a){var l=a.offsetLeft+a.offsetWidth/2-scroller.clientWidth/2;scroller.scrollTo({left:Math.max(0,l)})}
}

/* ---------- eras ---------- */
function eraYears(e){return e.ev[0].d.slice(0,4)+"–"+e.ev[e.ev.length-1].d.slice(0,4)}
function eraName(e){return e.n.replace(/^The\s+/,"").replace(/\s+Era$/,"")}
function buildEras(){
  var box=$("eras");box.innerHTML="";var seen={};
  DATA.forEach(function(o){seen[o.y]=(seen[o.y]||0)+1});
  Object.keys(seen).forEach(function(y){
    var n=vis.filter(function(o){return o.y==y}).length;
    var b=el("button","lw-era","");b.innerHTML="<strong>"+y+"</strong>";b.disabled=!n;b.title=n+" event"+(n>1?"s":"");
    if(DATA[cur].y==y)b.setAttribute("aria-current","true");
    b.onclick=function(){stop();var f=vis.filter(function(o){return o.y==y})[0];if(f)go(f.i)};
    box.appendChild(b)});
}
$("kick").textContent="Lazywall · "+DATA[0].y+"–"+DATA[DATA.length-1].y+" · "+DATA.length+" moments";

/* ---------- media ---------- */
function fallback(box,url,label){
  box.innerHTML="";var w=el("div","lw-empty");
  w.innerHTML=(url?svg(IC.img,44):'<div class="lw-wm">Lazywall</div>');
  if(url){var t=el("div","",label||"This picture is not available here.");w.appendChild(t);
    var a=el("a","lw-link");a.href=url;a.target="_blank";a.rel="noopener";a.innerHTML=svg(IC.ext,16)+"<span>Open original · "+host(url)+"</span>";w.appendChild(a);}
  else{w.appendChild(el("div","","No picture for this one yet — the memories are in the text."));}
  box.appendChild(w)}
function showMedia(o,n){
  mIdx=n;var view=$("view"),th=$("thumbs");view.innerHTML="";
  if(!o.m.length){fallback(view,null);th.hidden=true;return}
  var u=o.m[n],t=mType(u),box=el("div","lw-in");box.style.cssText="width:100%;height:100%;display:grid;place-items:center";
  if(t==="img"){
    var bl=el("div","lw-blur");bl.style.backgroundImage="url('"+u.replace(/'/g,"%27")+"')";view.appendChild(bl);
    var im=new Image();im.className="lw-img";im.alt=o.t;im.loading="eager";
    im.onerror=function(){view.innerHTML="";fallback(view,u)};
    im.onclick=function(){var lb=$("lb");lb.querySelector("img").src=u;lb.classList.add("on")};
    im.src=u;box.appendChild(im);
  }else if(t==="yt"){
    var id=ytId(u),b=el("button","lw-yt");b.style.backgroundImage="url(https://i.ytimg.com/vi/"+id+"/hqdefault.jpg)";b.setAttribute("aria-label","Play video");
    b.innerHTML='<span class="lw-playicon">'+svg(IC.play,26)+'</span>';
    b.onclick=function(){stop();b.innerHTML="";var f=document.createElement("iframe");f.src="https://www.youtube-nocookie.com/embed/"+id+"?autoplay=1&rel=0";f.allow="autoplay; encrypted-media; picture-in-picture; fullscreen";f.allowFullscreen=true;f.title=o.t;b.appendChild(f)};
    box.appendChild(b);
  }else if(t==="sc"){
    var s=el("div","lw-sc");s.innerHTML=svg(IC.note,46);s.appendChild(el("div","",o.t+" — audio"));
    var bt=el("button","lw-chip lw-play","Listen here");bt.onclick=function(){stop();s.innerHTML="";var f=document.createElement("iframe");f.src="https://w.soundcloud.com/player/?auto_play=true&url="+encodeURIComponent(u);f.allow="autoplay";f.title=o.t;s.appendChild(f)};
    s.appendChild(bt);box.appendChild(s);
  }else{fallback(box,u,"External link")}
  view.appendChild(box);
  th.innerHTML="";th.hidden=o.m.length<2;
  if(o.m.length>1)o.m.forEach(function(x,j){var b=el("button","lw-thumb");b.setAttribute("aria-label","Media "+(j+1));var tt=mType(x);
    if(tt==="img")b.style.backgroundImage="url('"+x.replace(/'/g,"%27")+"')";else if(tt==="yt")b.style.backgroundImage="url(https://i.ytimg.com/vi/"+ytId(x)+"/default.jpg)";else b.innerHTML=svg(tt==="sc"?IC.note:IC.ext,18);
    if(j===n)b.setAttribute("aria-current","true");b.onclick=function(){stop();showMedia(o,j)};th.appendChild(b)});
}

/* ---------- render ---------- */
function render(){
  var o=DATA[cur],d=fmtDate(o);
  var bd=$("badge");bd.style.setProperty("--c","var("+CATS[o.k][1]+")");bd.innerHTML="<i></i>"+CATS[o.k][0];
  var de=$("date");de.innerHTML="";de.appendChild(document.createTextNode(d.main));var sm=el("small","",d.sub);de.appendChild(sm);
  $("title").textContent=o.t;
  var urlOnly=/^https?:\/\/\S+$/.test(o.x||"");
  var tx=$("text");tx.textContent=urlOnly?"":(o.x||"");tx.style.display=o.x&&!urlOnly?"":"none";tx.classList.toggle("is-short",(o.x||"").length<30);
  var lk=$("links");lk.innerHTML="";
  if(urlOnly){var ua=el("a","lw-link");ua.href=o.x;ua.target="_blank";ua.rel="noopener";ua.innerHTML=svg(IC.ext,15)+"<span>Read more · "+host(o.x)+"</span>";lk.appendChild(ua)}
  o.m.forEach(function(u){var t=mType(u);if(t==="img"&&o.m.length===1)return;var a=el("a","lw-link");a.href=u;a.target="_blank";a.rel="noopener";
    a.innerHTML=svg(t==="sc"?IC.note:t==="yt"?IC.play:t==="img"?IC.img:IC.ext,15)+"<span>"+(t==="yt"?"Watch on YouTube":t==="sc"?"Listen on SoundCloud":t==="img"?"Picture":host(u))+"</span>";lk.appendChild(a)});
  var pos=vis.indexOf(o);
  if(o.era!==railEra||!track.children.length){curEra=o.era;buildRail();buildEras()}
  $("count").innerHTML="<b>"+(pos+1)+"</b> / "+vis.length;
  $("prev").disabled=pos<=0;$("next").disabled=pos>=vis.length-1;
  Array.prototype.forEach.call(document.querySelectorAll(".lw-info > *:not(.lw-nav)"),function(n){n.classList.remove("lw-in");void n.offsetWidth;n.classList.add("lw-in")});
  showMedia(o,0);markRail();
  Array.prototype.forEach.call($("list").querySelectorAll(".lw-row"),function(r){if(+r.dataset.i===cur)r.setAttribute("aria-current","true");else r.removeAttribute("aria-current")});
  try{history.replaceState(null,"","#e"+cur)}catch(e){}
}
function go(i){if(!DATA[i])return;cur=i;curEra=DATA[i].era;render()}
function step(dir){var p=vis.indexOf(DATA[cur])+dir;if(p>=0&&p<vis.length)go(vis[p].i);else if(playing)stop()}
function applyFilter(){
  vis=filter?DATA.filter(function(o){return o.k===filter}):DATA.slice();
  if(vis.indexOf(DATA[cur])<0)cur=vis[0].i;
  curEra=DATA[cur].era;buildRail();buildEras();buildList();render()}

/* ---------- list ---------- */
function buildList(){
  var l=$("list");l.innerHTML="";
  var le=-1;vis.forEach(function(o){var r=el("button","lw-row");r.dataset.i=o.i;r.style.setProperty("--c","var("+CATS[o.k][1]+")");
    r.innerHTML="<time>"+o.dd+" "+MONTHS[o.mo]+" "+o.y+"</time><i></i>";r.appendChild(el("span","",o.t));
    r.onclick=function(){stop();go(o.i);$("lw").scrollIntoView({behavior:"smooth",block:"start"})};l.appendChild(r)});
  $("listn").textContent=vis.length+" events ▾";
}
$("listbtn").onclick=function(){var on=$("list").classList.toggle("on");this.setAttribute("aria-expanded",on)};

/* ---------- play ---------- */
function stop(){playing=false;clearTimeout(timer);var b=$("bar");b.style.transition="none";b.style.width="0";pb.querySelector("span").textContent="Play the story";pb.querySelector("svg").style.opacity=1}
function tick(){if(!playing)return;var b=$("bar");b.style.transition="none";b.style.width="0";void b.offsetWidth;b.style.transition="width "+PLAY_MS+"ms linear";b.style.width="100%";
  timer=setTimeout(function(){if(vis.indexOf(DATA[cur])>=vis.length-1){stop();return}step(1);tick()},PLAY_MS)}
pb.onclick=function(){if(playing){stop();return}if(vis.indexOf(DATA[cur])>=vis.length-1)go(vis[0].i);playing=true;pb.querySelector("span").textContent="Pause";tick()};

/* ---------- controls ---------- */
$("prev").onclick=function(){stop();step(-1)};$("next").onclick=function(){stop();step(1)};
document.addEventListener("keydown",function(e){
  if(e.target.closest&&e.target.closest("iframe"))return;
  if(e.key==="Escape"){$("lb").classList.remove("on");return}
  if(e.key==="ArrowRight"){stop();step(1)}else if(e.key==="ArrowLeft"){stop();step(-1)}});
$("lb").onclick=function(){this.classList.remove("on")};
var sx=null;var st=document.querySelector(".lw-stage");
st.addEventListener("touchstart",function(e){sx=e.touches[0].clientX},{passive:true});
st.addEventListener("touchend",function(e){if(sx==null)return;var dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>60){stop();step(dx<0?1:-1)}});

var h=location.hash.match(/^#e(\d+)$/);if(h&&DATA[+h[1]])cur=+h[1];
curEra=DATA[cur].era;buildEras();buildRail();buildList();render();
})();
</script>
